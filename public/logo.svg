<svg width="820" height="220" viewBox="0 0 820 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">AI Call Analytics Logo</title>
  <desc id="logo-desc">Logo with headset, speech bubble, audio waveform and AI Call Analytics text.</desc>
  <defs>
    <linearGradient id="brandGradient" x1="56" y1="38" x2="176" y2="178" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0EA5FF"/>
      <stop offset="1" stop-color="#5B2CFF"/>
    </linearGradient>
  </defs>
  <g transform="translate(28 18)">
    <!-- Headset arc -->
    <path d="M32 96C32 47.4 71.4 8 120 8C168.6 8 208 47.4 208 96" stroke="#06142E" stroke-width="16" stroke-linecap="round"/>
    <!-- Left ear cup -->
    <rect x="8" y="94" width="32" height="66" rx="16" fill="#06142E"/>
    <!-- Right ear cup -->
    <rect x="200" y="94" width="32" height="66" rx="16" fill="#06142E"/>
    <!-- Boom mic arm -->
    <path d="M216 150C216 177 196 190 169 190" stroke="#06142E" stroke-width="14" stroke-linecap="round"/>
    <!-- Mic bar -->
    <rect x="150" y="180" width="42" height="20" rx="10" fill="#06142E"/>
    <!-- Speech bubble -->
    <path d="M120 40C155.3 40 184 68.7 184 104C184 139.3 155.3 168 120 168H96L62 196V156.8C48.2 145.1 40 128 40 104C40 68.7 68.7 40 120 40Z" stroke="url(#brandGradient)" stroke-width="14" stroke-linejoin="round"/>
    <!-- Waveform bars -->
    <rect x="82"  y="92" width="14" height="44" rx="7" fill="url(#brandGradient)"/>
    <rect x="108" y="72" width="14" height="84" rx="7" fill="url(#brandGradient)"/>
    <rect x="134" y="88" width="14" height="52" rx="7" fill="url(#brandGradient)"/>
    <rect x="160" y="98" width="14" height="32" rx="7" fill="url(#brandGradient)"/>
  </g>
  <g transform="translate(300 60)">
    <text x="0" y="44" font-family="Inter, Arial, Helvetica, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5" fill="#06142E">AI Call</text>
    <text x="0" y="104" font-family="Inter, Arial, Helvetica, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5" fill="#06142E">Analytics</text>
    <text x="2" y="144" font-family="Inter, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="5" fill="#64748B">LISTEN. ANALYZE. IMPROVE SALES.</text>
  </g>
</svg>
